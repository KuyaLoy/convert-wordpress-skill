<title>{{SITE}} Build Map</title>
<meta name="description" content="Private status board for the {{SITE}} WordPress build.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&family=Montagu+Slab:opsz,wght@16..144,600;16..144,700&display=swap">
<style>
/* Layout: a job sheet. A dark header, a summary strip, the sprints drawn as one line with a
   stage per sprint (lit where work is moving), then the detail in working order: now and decisions, sprint cards,
   the route tracker, shared pieces and risks, log. Set --brand, --band, --lime and the fonts to the site's own colours and faces. */
:root{
  --bg:#EEF2F7;
  --surface:#FFFFFF;
  --surface-2:#F5F7FB;
  --ink:#16202E;
  --muted:#56637A;
  --line:#D7DEE8;
  --brand:#2F4B8A;
  --band:#17243D;
  --band-2:#1F2F4E;
  --band-ink:#FFFFFF;
  --band-muted:#C9D4E8;
  --band-line:rgba(201,212,232,.35);
  --lime:#5FB3A6;
  --pipe:#D3DBE7;
  --ok:#1B7A4B;
  --ok-bg:#DFF2E7;
  --prog:#1E5F9A;
  --prog-bg:#E0ECF7;
  --todo:#5A6577;
  --todo-bg:#E9EDF3;
  --block:#AD2A23;
  --block-bg:#FAE2E0;
  --dec:#7F5100;
  --dec-bg:#FAEBCB;
  --focus:#1E5F9A;
  --display:'Montagu Slab', Georgia, 'Times New Roman', serif;
  --body:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius:16px;
  --radius-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C111B; --surface:#121A28; --surface-2:#172133; --ink:#E3E9F2; --muted:#9EAAC0; --line:#26324A;
    --brand:#8FA9E6; --band:#101B2E; --band-2:#16243C; --band-ink:#FFFFFF; --band-muted:#B7C4DD;
    --band-line:rgba(183,196,221,.3); --lime:#73C9BB; --pipe:#2A3650;
    --ok:#5BD395; --ok-bg:#113527; --prog:#8BC2F2; --prog-bg:#132E47; --todo:#B3BDCC; --todo-bg:#1C2638;
    --block:#FF9187; --block-bg:#401D1A; --dec:#F3C453; --dec-bg:#382C11; --focus:#8BC2F2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C111B; --surface:#121A28; --surface-2:#172133; --ink:#E3E9F2; --muted:#9EAAC0; --line:#26324A;
  --brand:#8FA9E6; --band:#101B2E; --band-2:#16243C; --band-ink:#FFFFFF; --band-muted:#B7C4DD;
  --band-line:rgba(183,196,221,.3); --lime:#73C9BB; --pipe:#2A3650;
  --ok:#5BD395; --ok-bg:#113527; --prog:#8BC2F2; --prog-bg:#132E47; --todo:#B3BDCC; --todo-bg:#1C2638;
  --block:#FF9187; --block-bg:#401D1A; --dec:#F3C453; --dec-bg:#382C11; --focus:#8BC2F2;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.page{max-width:1200px;margin:0 auto;padding-inline:max(16px,3vw);padding-block:20px 56px;display:grid;gap:28px}
.page > *{min-width:0}
[id]{scroll-margin-top:64px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.015em;line-height:1.1;text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--brand)}
code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:.05em .35em;overflow-wrap:anywhere}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* job header */
.band{background:linear-gradient(135deg,var(--band) 0%,var(--band-2) 100%);color:var(--band-ink);border-radius:var(--radius);padding:clamp(20px,3.6vw,38px);display:grid;gap:14px}
.band .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
.band h1{font-size:clamp(34px,5.4vw,56px);font-weight:700;color:var(--band-ink)}
.band-meta{display:flex;flex-wrap:wrap;gap:12px 36px;margin:4px 0 0}
.band-meta div{display:grid;gap:2px}
.band-meta dt{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--band-muted)}
.band-meta dd{margin:0;font-size:16px;font-weight:600}
.band-note{color:var(--band-muted);max-width:70ch}
.private{display:flex;gap:10px;align-items:flex-start;max-width:84ch;font-size:13.5px;color:var(--band-muted);border-top:1px solid var(--band-line);padding-top:14px}
.private strong{color:var(--band-ink)}
.ico{width:18px;height:18px;flex:none;margin-top:1px;color:var(--lime)}

/* section nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);margin-top:-14px}
.nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:8px 0;overflow-x:auto;scrollbar-width:thin}
.nav a{display:block;padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:13.5px;white-space:nowrap}
.nav a:hover{background:var(--surface);color:var(--ink)}

/* status chips */
.chip{display:inline-flex;align-items:center;gap:6px;justify-self:start;align-self:start;white-space:nowrap;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;line-height:1;padding:5px 9px 5px 8px;border-radius:999px;color:var(--c);background:var(--cb)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.chip-done{--c:var(--ok);--cb:var(--ok-bg)}
.chip-prog{--c:var(--prog);--cb:var(--prog-bg)}
.chip-todo{--c:var(--todo);--cb:var(--todo-bg)}
.chip-block{--c:var(--block);--cb:var(--block-bg)}
.chip-dec{--c:var(--dec);--cb:var(--dec-bg)}

/* summary */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:grid;gap:8px;align-content:start}
.tile .k{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--display);font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.tile .v small{font-family:var(--body);font-size:15px;font-weight:600;color:var(--muted)}
.tile .s{font-size:13.5px;color:var(--muted)}
.tile .s strong{color:var(--ink)}
.tile .ids{display:flex;flex-wrap:wrap;gap:6px}
.tile .ids a{font-family:var(--mono);font-size:12.5px;font-weight:600;text-decoration:none;color:var(--dec);background:var(--dec-bg);padding:3px 8px;border-radius:999px}
.bar{height:8px;border-radius:999px;background:var(--pipe);overflow:hidden}
.bar.thin{height:5px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:inherit}
.legend{margin-top:-14px;display:flex;flex-wrap:wrap;gap:8px}

/* section heads and panels */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;margin-bottom:14px}
.sec-head h2{font-size:clamp(22px,2.4vw,28px);font-weight:700}
.meta{color:var(--muted);font-size:13.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px clamp(16px,2.4vw,24px) 10px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:16px;align-items:start}
.split > *{min-width:0}
@media (max-width:880px){.split{grid-template-columns:minmax(0,1fr)}}

/* sprint pipeline: one line, a stage per sprint */
.pipeline{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.pipeline li{position:relative;padding:56px 14px 4px 0;display:grid;gap:6px;align-content:start;min-width:0}
.pipeline li::before{content:"";position:absolute;left:0;right:0;top:17px;height:10px;background:var(--pipe)}
.pipeline li:first-child::before{left:22px}
.pipeline li:last-child::before{right:auto;width:22px}
.pipeline li.flowing::before{background:var(--lime)}
.stage-dot{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:3px solid var(--pipe);font-family:var(--mono);font-weight:600;font-size:13px;color:var(--muted);z-index:1}
.state-prog .stage-dot{border-color:var(--prog);color:var(--prog)}
.state-done .stage-dot{border-color:var(--ok);background:var(--ok);color:var(--surface)}
.state-block .stage-dot{border-color:var(--block);color:var(--block)}
.current .stage-dot{box-shadow:0 0 0 6px var(--prog-bg)}
.pipeline .name{font-weight:700;font-size:14.5px;line-height:1.3}
.pipeline .count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pipeline .goal{font-size:12.5px;color:var(--muted);line-height:1.45}
@media (max-width:880px){
  .pipeline{grid-template-columns:minmax(0,1fr)}
  .pipeline li{padding:6px 0 24px 64px}
  .pipeline li::before{left:17px;right:auto;top:0;bottom:0;width:10px;height:auto}
  .pipeline li:first-child::before{left:17px;top:22px}
  .pipeline li:last-child::before{bottom:auto;width:10px;height:22px}
}

/* now and decisions */
.now,.decs{display:grid}
.now-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:8px 14px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.now-row:first-child{border-top:0;padding-top:0}
@media (max-width:480px){.now-row{grid-template-columns:minmax(0,1fr)}}
.dec{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.dec:first-child{border-top:0;padding-top:0}
.dec .id{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--muted);padding-top:1px}
.dec .t{font-weight:600}
.dec .r{grid-column:2 / -1;color:var(--muted);font-size:14px}

/* sprint cards */
.sprints{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px;align-items:start}
.sprint{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px 6px;display:grid;gap:10px;min-width:0}
.sprint.is-current{border-color:var(--prog);box-shadow:0 0 0 3px var(--prog-bg)}
.sprint header{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px}
.sprint .code{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px 7px}
.sprint h3{font-size:19px;font-weight:700;min-width:0}
.stories{list-style:none;margin:0;padding:0}
.story{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:3px 10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.story .id{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted);padding-top:2px}
.story .st{font-size:14px}
.story .notes{grid-column:2 / -1;font-size:13px;color:var(--muted)}
@media (max-width:420px){.story{grid-template-columns:minmax(0,1fr) auto}.story .id,.story .notes{grid-column:1 / -1}}

/* route tracker */
.step-sums{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin-bottom:14px}
.step-sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:baseline}
.step-sum .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.step-sum .n{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.step-sum .bar{grid-column:1 / -1}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;margin-bottom:12px}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.seg{font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer}
.seg:hover{color:var(--ink);border-color:var(--muted)}
.seg[aria-pressed="true"]{background:var(--band);border-color:var(--band);color:var(--band-ink)}
.search{flex:0 1 280px;min-width:0}
.search input{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;width:100%}
.search input::placeholder{color:var(--muted)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:780px;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
thead th{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
th.step,td.step{text-align:center;width:84px}
td.sp{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
td.route{overflow-wrap:anywhere}
td.route code{background:none;border:0;padding:0;font-size:13px;color:var(--ink)}
tr.global td{background:var(--surface-2)}
tbody tr:hover td{background:var(--surface-2)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--pipe);vertical-align:middle}
.tick{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ok);color:var(--surface);vertical-align:middle}
.tick svg{width:15px;height:15px}
.na{font-size:12px;color:var(--muted)}
td.step.open{font-size:12px;text-align:left;color:var(--muted);width:auto}
#gates{margin-top:28px}
.empty{padding:18px;color:var(--muted)}

/* shared pieces, risks, log */
.list,.log{list-style:none;margin:0;padding:0}
.row3{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.row3:first-child{border-top:0;padding-top:0}
.row3 .w{font-size:12.5px;color:var(--muted);white-space:nowrap}
@media (max-width:520px){.row3{grid-template-columns:minmax(0,1fr) auto}.row3 .w{grid-column:1 / -1;grid-row:2}}
.risk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.risk:first-child{border-top:0;padding-top:0}
.risk .t{font-weight:600}
.risk .w{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.risk .plan{grid-column:1 / -1;color:var(--muted);font-size:14px}
.log li{padding:10px 0;border-top:1px solid var(--line)}
.log li:first-child{border-top:0;padding-top:0}
.foot{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:16px}
.foot p{max-width:90ch}
</style>

<div class="page">
<!--BODY-->
</div>

<script>
(function () {
  var KEY = 'buildmap-filter';
  var rows = [].slice.call(document.querySelectorAll('#pages tbody tr'));
  var segs = [].slice.call(document.querySelectorAll('#pages .seg'));
  var input = document.getElementById('page-search');
  var count = document.getElementById('page-count');
  var empty = document.getElementById('page-empty');
  if (!rows.length || !input) return;
  var state = { filter: 'all', q: '' };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && typeof saved.filter === 'string') { state.filter = saved.filter; state.q = String(saved.q || ''); }
  } catch (e) {}
  if (!segs.some(function (b) { return b.dataset.filter === state.filter; })) state.filter = 'all';

  function apply() {
    var q = state.q.trim().toLowerCase(), shown = 0;
    rows.forEach(function (tr) {
      var f = state.filter;
      var ok = f === 'all' || (f === 'global' ? tr.dataset.global === '1' : tr.dataset.sprint === f);
      if (ok && q) ok = tr.dataset.text.indexOf(q) !== -1;
      tr.hidden = !ok;
      if (ok) shown++;
    });
    segs.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.filter === state.filter)); });
    count.textContent = shown === rows.length ? rows.length + ' rows' : shown + ' of ' + rows.length + ' rows';
    empty.hidden = shown !== 0;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  segs.forEach(function (b) { b.addEventListener('click', function () { state.filter = b.dataset.filter; apply(); }); });
  input.value = state.q;
  input.addEventListener('input', function () { state.q = input.value; apply(); });
  apply();
})();
</script>
